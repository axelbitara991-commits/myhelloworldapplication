services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: myhelloworldapplication_development
      MYSQL_USER: myhelloworldapplication
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: bin/rails server -b 0.0.0.0 -p 3000
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_USERNAME: myhelloworldapplication
      DB_PASSWORD: password
    volumes:
      - .:/rails

volumes:
  mysql_data: